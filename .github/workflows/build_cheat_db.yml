name: Build cheat.db

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'cheat/**.psv'
      - 'patch/patchlist.xml'
      - '.github/workflows/build_cheat_db.yml'
  pull_request:
    paths:
      - 'cheat/**.psv'
      - 'patch/patchlist.xml'
      - '.github/workflows/build_cheat_db.yml'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs publish the rolling tag at once.
concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Merge PSV files into cheat.db
        run: |
          set -euo pipefail

          output="cheat.db"
          rm -f "$output"

          {
            echo "########################################"
            echo ">>>Start Of VitaCheat Database (v0.1)<<<"
            echo "########################################"
          } > "$output"

          count=0
          while IFS= read -r psv; do
            title="$(basename "$psv" .psv)"
            echo "Merging: $psv"
            echo "_S $title" >> "$output"
            # Drop the UTF-8 BOM and CR, then strip blank and comment lines.
            sed -e '1s/^\xEF\xBB\xBF//' -e 's/\r$//' "$psv" \
              | grep -v '^[[:space:]]*$' \
              | grep -v '^[[:space:]]*#' >> "$output"
            echo "" >> "$output"
            count=$((count + 1))
          done < <(find cheat -name '*.psv' | sort)

          echo "Done. $count file(s) merged, $(wc -l < "$output") lines."

      - name: Upload cheat.db as artifact
        uses: actions/upload-artifact@v7
        with:
          name: cheat-db
          path: cheat.db
          archive: false

      - name: Collect release assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp cheat.db dist/cheat.db
          cp patch/patchlist.xml dist/patchlist.xml
          ls -l dist

      - name: Publish the rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
        uses: tcnksm/ghr@v0
        with:
          tag: latest
          path: dist
          commitish: ${{ github.sha }}
          name: Latest database
          body: |
            Built from ${{ github.sha }}.

            - `cheat.db` - every `cheat/*.psv` file merged into one VitaCheat database.
            - `patchlist.xml` - the VitaGrafix patch list.

            The assets are replaced on every push to `dev`, so these URLs stay stable:

                https://github.com/${{ github.repository }}/releases/latest/download/cheat.db
                https://github.com/${{ github.repository }}/releases/latest/download/patchlist.xml
          delete: true
